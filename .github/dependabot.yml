version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      remotion:
        patterns:
          - remotion
          - "@remotion/*"
      fumadocs:
        patterns:
          - fumadocs-*
    ignore:
      # v6 loads its worker from import.meta.url, which bundlers rewrite; maps never load
      - dependency-name: maplibre-gl
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
