name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main: it may be mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build packages
        run: pnpm build

      - name: Test CLI
        run: pnpm --filter remotion-ui test

      - name: Build registry
        run: pnpm registry:build

      - name: Build docs site
        run: pnpm --filter web build

      # Production deploy: only after everything above passed on main.
      # Uploads apps/web/out plus apps/web/functions (see wrangler.toml).
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # pnpm dlx, not wrangler-action: the action installs wrangler with npm,
        # which cannot resolve this workspace's workspace:* dependencies.
        run: pnpm dlx wrangler@4.167.0 pages deploy --branch main --commit-hash ${{ github.sha }} --commit-dirty=true
